name: Build and upload assets
on:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Build gnu-linux on ubuntu-18.04 and musl on ubuntu latest
        # os: [ ubuntu-18.04, ubuntu-latest, windows-latest, macos-latest ]
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    name: Building, ${{ matrix.os }}
    steps:
      - name: Fix CRLF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build Outputs
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Tauri desktop links against glibc + WebKitGTK (not musl); install before the Linux build step.
      - name: Install Tauri / WebKit GTK dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.0-dev &>/dev/null && apt-cache show libjavascriptcoregtk-4.0-dev &>/dev/null; then
            WEBKIT_PKG=libwebkit2gtk-4.0-dev
            JSCORE_PKG=libjavascriptcoregtk-4.0-dev
            NEED_PC_ALIAS=0
          elif apt-cache show libwebkit2gtk-4.1-dev &>/dev/null && apt-cache show libjavascriptcoregtk-4.1-dev &>/dev/null; then
            WEBKIT_PKG=libwebkit2gtk-4.1-dev
            JSCORE_PKG=libjavascriptcoregtk-4.1-dev
            NEED_PC_ALIAS=1
          else
            echo "::error::No compatible WebKit/JSC dev package pair found in apt cache."
            exit 1
          fi
          sudo apt-get install -y \
            "$WEBKIT_PKG" \
            "$JSCORE_PKG" \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libsoup2.4-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
          if [ "$NEED_PC_ALIAS" = "1" ]; then
            sudo ldconfig
            JSCORE_PC_DIR="$(pkg-config --variable pcfiledir javascriptcoregtk-4.1)"
            WEBKIT_PC_DIR="$(pkg-config --variable pcfiledir webkit2gtk-4.1)"
            sudo mkdir -p /usr/local/lib/pkgconfig
            sudo ln -sf "$JSCORE_PC_DIR/javascriptcoregtk-4.1.pc" /usr/local/lib/pkgconfig/javascriptcoregtk-4.0.pc
            sudo ln -sf "$WEBKIT_PC_DIR/webkit2gtk-4.1.pc" /usr/local/lib/pkgconfig/webkit2gtk-4.0.pc
            echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

            shopt -s nullglob
            _jsc=(/usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-4.1.so*)
            _wk=(/usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so*)
            shopt -u nullglob
            JSCORE_SO=""
            WEBKIT_SO=""
            if [ "${#_jsc[@]}" -gt 0 ]; then JSCORE_SO="$(readlink -f "${_jsc[0]}" 2>/dev/null || printf '%s' "${_jsc[0]}")"; fi
            if [ "${#_wk[@]}" -gt 0 ]; then WEBKIT_SO="$(readlink -f "${_wk[0]}" 2>/dev/null || printf '%s' "${_wk[0]}")"; fi
            if [ -z "$JSCORE_SO" ]; then
              JSCORE_SO="$(ldconfig -p 2>/dev/null | awk '/libjavascriptcoregtk-4\.1\.so/{print $NF; exit}')"
            fi
            if [ -z "$WEBKIT_SO" ]; then
              WEBKIT_SO="$(ldconfig -p 2>/dev/null | awk '/libwebkit2gtk-4\.1\.so/{print $NF; exit}')"
            fi

            if [ -n "$JSCORE_SO" ] && [ -n "$WEBKIT_SO" ]; then
              sudo ln -sf "$JSCORE_SO" /usr/local/lib/libjavascriptcoregtk-4.0.so
              sudo ln -sf "$WEBKIT_SO" /usr/local/lib/libwebkit2gtk-4.0.so
              echo "LIBRARY_PATH=/usr/local/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
              echo "LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
              echo "RUSTFLAGS=-L/usr/local/lib ${RUSTFLAGS:-}" >> "$GITHUB_ENV"
            else
              echo "::error::Could not resolve WebKit/JSC 4.1 .so paths (needed for -lwebkit2gtk-4.0 / -ljavascriptcoregtk-4.0)."
              ldconfig -p 2>/dev/null | grep -iE 'webkit|javascript' || true
              ls -la /usr/lib/x86_64-linux-gnu/libwebkit2gtk* /usr/lib/x86_64-linux-gnu/libjavascriptcoregtk* 2>/dev/null || true
              exit 1
            fi
          fi

      - name: Build on Linux
        if: runner.os == 'Linux'
        # We're using musl to make the binaries statically linked and portable
        run: |
          # Run build script for musl toolchain
          source musl-toolchain/build.sh
          
          # Go back to the workspace
          cd $GITHUB_WORKSPACE
          
          # Build non-bridge binaries first
          cargo --verbose build --bin kaspad --bin rothschild --bin kaspa-wallet --release --target x86_64-unknown-linux-musl
          # Build bridge with allow-multiple-definition to resolve mimalloc/libstdc++ symbol collisions.
          # musl-toolchain/build.sh sets RUSTFLAGS directly, so we append this flag here explicitly.
          export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,--allow-multiple-definition"
          cargo --verbose build --bin stratum-bridge --release --target x86_64-unknown-linux-musl
          mkdir bin || true
          cp target/x86_64-unknown-linux-musl/release/kaspad bin/
          cp target/x86_64-unknown-linux-musl/release/rothschild bin/
          cp target/x86_64-unknown-linux-musl/release/kaspa-wallet bin/
          cp target/x86_64-unknown-linux-musl/release/stratum-bridge bin/
          # Copy bridge configuration file
          cp bridge/config.yaml bin/
          # rkstratum-bridge-desktop (Tauri): host glibc + WebKitGTK — must not inherit musl static RUSTFLAGS/CC.
          (
            unset RUSTFLAGS CC CXX LD AR OPENSSL_STATIC CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
            unset CC_x86_64_unknown_linux_musl CXX_x86_64_unknown_linux_musl AR_x86_64_unknown_linux_musl
            unset LD_x86_64_unknown_linux_musl RANLIB_x86_64_unknown_linux_musl
            cd "$GITHUB_WORKSPACE"
            # Host WebKit symlinks live under /usr/local/lib; subshell cleared RUSTFLAGS so restore link search.
            export RUSTFLAGS="-L/usr/local/lib"
            cargo build --bin rkstratum-bridge-desktop --release
            cp target/release/rkstratum-bridge-desktop bin/
          )
          archive="bin/rusty-kaspa-${{ github.event.release.tag_name }}-linux-amd64.zip"
          zip -r "${archive}" ./bin/*
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Install AppImage packaging deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fuse libfuse2

      - name: Build stratum-bridge AppImage (Linux)
        id: appimage
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE
          bash bridge/appimage/build.sh "${{ github.event.release.tag_name }}"

      - name: Pack AppImage tarball (preserves executable bit on Linux extract)
        if: runner.os == 'Linux' && steps.appimage.outcome == 'success'
        run: |
          cd "$GITHUB_WORKSPACE"
          IMG="stratum-bridge-${{ github.event.release.tag_name }}-x86_64.AppImage"
          tar -czf "${IMG}.tar.gz" "$IMG"
          echo "appimage_tarball=${GITHUB_WORKSPACE}/${IMG}.tar.gz" >> $GITHUB_ENV

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --bin kaspad --release
          cargo build --bin rothschild --release
          cargo build --bin kaspa-wallet --release
          cargo build --bin stratum-bridge --release
          cargo build --bin rkstratum-bridge-desktop --release
          mkdir bin || true
          cp target/release/kaspad.exe bin/
          cp target/release/rothschild.exe bin/
          cp target/release/kaspa-wallet.exe bin/
          cp target/release/stratum-bridge.exe bin/
          cp target/release/rkstratum-bridge-desktop.exe bin/
          # Copy bridge configuration and batch files
          cp bridge/config.yaml bin/
          cp bridge/Start-Kaspad.bat bin/
          cp bridge/Start-stratum-bridge-externalMode.bat bin/
          archive="bin/rusty-kaspa-${{ github.event.release.tag_name }}-win64.zip"
          powershell "Compress-Archive bin/* \"${archive}\""
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Build on MacOS
        if: runner.os == 'macOS'
        run: |
          cargo build --bin kaspad --release
          cargo build --bin rothschild --release
          cargo build --bin kaspa-wallet --release
          cargo build --bin stratum-bridge --release
          cargo build --bin rkstratum-bridge-desktop --release
          mkdir bin || true
          cp target/release/kaspad bin/
          cp target/release/rothschild bin/
          cp target/release/kaspa-wallet bin/
          cp target/release/stratum-bridge bin/
          cp target/release/rkstratum-bridge-desktop bin/
          # Copy bridge configuration file
          cp bridge/config.yaml bin/
          archive="bin/rusty-kaspa-${{ github.event.release.tag_name }}-osx.zip"
          zip -r "${archive}" ./bin/*
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./${{ env.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ship only the tarball: raw .AppImage from browser/GitHub UI often loses +x; tar.gz preserves it on extract.
      - name: Upload stratum-bridge AppImage release tarball
        if: runner.os == 'Linux' && steps.appimage.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.appimage_tarball }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-wasm:
    runs-on: ubuntu-latest
    name: Building WASM32 SDK
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install llvm
        id: install_llvm
        continue-on-error: true
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-get install -y clang-15 lldb-15 lld-15 clangd-15 clang-tidy-15 clang-format-15 clang-tools-15 llvm-15-dev lld-15 lldb-15 llvm-15-tools libomp-15-dev libc++-15-dev libc++abi-15-dev libclang-common-15-dev libclang-15-dev libclang-cpp15-dev libunwind-15-dev
          # Make Clang 15 default
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/lib/llvm-15/bin/clang++ 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/lib/llvm-15/bin/clang 100
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/lib/llvm-15/bin/clang-format 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/lib/llvm-15/bin/clang-tidy 100
          sudo update-alternatives --install /usr/bin/run-clang-tidy run-clang-tidy /usr/lib/llvm-15/bin/run-clang-tidy 100
          # Alias cc to clang
          sudo update-alternatives --install /usr/bin/cc cc /usr/lib/llvm-15/bin/clang 0
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/lib/llvm-15/bin/clang++ 0

      - name: Install gcc-multilib
        # gcc-multilib allows clang to find gnu libraries properly
        run: |
          sudo apt-get update
          sudo apt install -y gcc-multilib

      - name: Install stable toolchain
        if: steps.install_llvm.outcome == 'success' && steps.install_llvm.conclusion == 'success'
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NodeJS dependencies
        run: npm install --global typedoc typescript

      - name: Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WASM32 SDK
        run: |
          cd wasm
          bash build-release
          cd release
          zip -q -r kaspa-wasm32-sdk-${{ github.event.release.tag_name }}.zip kaspa-wasm32-sdk
          archive="wasm/release/kaspa-wasm32-sdk-${{ github.event.release.tag_name }}.zip"
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./${{ env.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
